; ==========================================================
; 5) 国家节点 / 专属节点测速组
; ==========================================================
; 全节点
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; 🏛️ 专属甲骨文组（匹配名字里带“甲骨文”或“oracle”的节点）
custom_proxy_group=🏛️ 甲骨文`url-test`(?i)(甲骨文|oracle)`http://www.gstatic.com/generate_204`300,,50

; 地区组
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\bHK\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\bJP\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\bSG\b|singapore)`http://www.gstatic.com/generate_204`300,,50

; 🇺🇸 美国组（已把甲骨文/oracle 加入匹配）
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\bUS\b|united states|los angeles|san jose|seattle|new york|甲骨文|oracle)`http://www.gstatic.com/generate_204`300,,50

; 冷门节点池（排除了五大区 + 甲骨文）
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\bHK\b|hong\s*kong|🇯🇵|日本|\bJP\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york|甲骨文|oracle)).*
